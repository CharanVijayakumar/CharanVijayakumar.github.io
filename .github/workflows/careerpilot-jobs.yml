name: Refresh public job feed
on:
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh jobs
        run: python careerpilot/update_jobs.py
      - name: Commit changed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add careerpilot/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CareerPilot public jobs"
            git push
          fi
