# Disabled automatic remote-only collection: ChatGPT's morning research is the source of research.
# This workflow is manual-only and must not be mistaken for ChatGPT task integration.
name: CareerPilot manual feed refresh (optional)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python careerpilot/update_jobs.py
      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add careerpilot/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Manually refresh public job feed"
            git push
          fi
